name: Publish

# Tokenless npm publish for @baseland/dsh-evidence.
# Push and pull_request do not run this workflow.
# A maintainer starts it by hand, or a GitHub pre-release does.
# The release environment is expected to require maintainer approval.
# The default dist-tag is beta. latest is only the explicit manual choice,
# and only for a version that is not a prerelease.

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: >-
          npm dist-tag. beta is the pre-release tag. latest is only for a
          non-prerelease version you have decided to call stable.
        type: choice
        options:
          - beta
          - latest
        default: beta
      git_ref:
        description: >-
          Optional tag or commit to publish, such as v0.6.0-beta.2.
          Leave empty to use the ref selected for this run.
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == true
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Choose the commit to publish
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_REF: ${{ inputs.git_ref }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = release ]; then
            ref="$RELEASE_TAG"
          elif [ -n "${INPUT_REF}" ]; then
            ref="$INPUT_REF"
          else
            ref="$DEFAULT_SHA"
          fi
          case "$ref" in
            *[!A-Za-z0-9._/-]* | '')
              echo "::error::refusing to check out unexpected ref"
              exit 1
              ;;
          esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.ref }}
          persist-credentials: false

      - name: Use Node.js 24.3.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.3.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install the npm CLI that trusted publishing requires
        run: npm install --global npm@11.5.1

      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.34.5 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to npm
        env:
          EVENT_NAME: ${{ github.event_name }}
          DIST_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.dist_tag || 'beta' }}
        run: |
          set -eu
          if [ -n "${NODE_AUTH_TOKEN:-}" ] || [ -n "${NPM_TOKEN:-}" ]; then
            echo "::error::refusing to publish with an npm token; this workflow uses GitHub OIDC only"
            exit 1
          fi
          unset NODE_AUTH_TOKEN || true
          if [ -f .npmrc ]; then
            grep -v '_authToken' .npmrc > .npmrc.without-token || true
            mv .npmrc.without-token .npmrc
          fi
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const tag = process.env.DIST_TAG
          const event = process.env.EVENT_NAME
          if (pkg.name !== '@baseland/dsh-evidence') {
            console.error(`refusing to publish unexpected package ${pkg.name}`)
            process.exit(1)
          }
          if (tag !== 'beta' && tag !== 'latest') {
            console.error(`refusing unsupported dist-tag ${tag}`)
            process.exit(1)
          }
          if (event !== 'workflow_dispatch' && tag !== 'beta') {
            console.error('a GitHub release may only publish with --tag beta')
            process.exit(1)
          }
          if (tag === 'latest' && pkg.version.includes('-')) {
            console.error(`refusing to point latest at prerelease ${pkg.version}`)
            process.exit(1)
          }
          console.log(`publishing ${pkg.name}@${pkg.version} with dist-tag ${tag}`)
          EOF
          npm publish --access public --tag "$DIST_TAG" --provenance

  stable-github-release:
    name: stable GitHub release does not publish
    if: github.event_name == 'release' && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Leave npm latest unchanged
        run: |
          echo "::warning::This GitHub release is not marked as a pre-release, so nothing was published and the npm latest tag was not moved. To publish a non-prerelease version as latest, run the Publish workflow manually and choose dist-tag latest."

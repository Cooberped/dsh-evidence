name: Publish

# Future publishes of @baseland/dsh-evidence. The first version,
# 0.6.0-beta.1, was published with a granular npm token. That token is
# not stored here. This workflow uses GitHub OIDC only.
#
# It does not run on push, pull_request, or tag creation. A maintainer
# starts it with workflow_dispatch, then the release environment must
# approve the job. If a tag trigger is added later, keep environment: release.

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: >-
          npm dist-tag. beta is the default and the tag for prereleases.
          latest is only for a non-prerelease version you have decided to call stable.
        type: choice
        options:
          - beta
          - latest
        default: beta
      git_ref:
        description: >-
          Optional tag or commit to publish, such as v0.6.0-beta.2.
          Leave empty to use the ref selected for this run.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Choose the commit to publish
        id: target
        env:
          INPUT_REF: ${{ inputs.git_ref }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ -n "${INPUT_REF}" ]; then
            ref="$INPUT_REF"
          else
            ref="$DEFAULT_SHA"
          fi
          case "$ref" in
            *[!A-Za-z0-9._/-]* | '')
              echo "::error::refusing to check out unexpected ref"
              exit 1
              ;;
          esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.ref }}
          persist-credentials: false

      # registry-url is the OIDC setup npm documents. Do not add an NPM_TOKEN secret.
      # Node.js 24.5.0 is the first 24.x that bundles npm 11.5.1. 24.3.0 bundles
      # npm 11.4.2, and that CLI fails the OIDC handshake with a misleading E404.
      - name: Use Node.js 24.5.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.5.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require the bundled npm that trusted publishing needs
        run: |
          set -eu
          node --input-type=module <<'EOF'
          import { execSync } from 'node:child_process'
          const [nodeMajor, nodeMinor] = process.versions.node.split('.').map(Number)
          if (nodeMajor < 24 || (nodeMajor === 24 && nodeMinor < 5)) {
            console.error(`Node.js ${process.versions.node} is too old. Use 24.5.0 or newer so the bundled npm is at least 11.5.1.`)
            process.exit(1)
          }
          const npmVersion = execSync('npm --version', { encoding: 'utf8' }).trim()
          const parts = npmVersion.split('.').map(Number)
          const tooOld = parts[0] < 11 || (parts[0] === 11 && (parts[1] < 5 || (parts[1] === 5 && parts[2] < 1)))
          if (tooOld) {
            console.error(`npm ${npmVersion} cannot complete trusted publishing. Need >= 11.5.1. Older npm fails the OIDC handshake with a misleading E404.`)
            process.exit(1)
          }
          console.log(`node ${process.versions.node}, npm ${npmVersion}`)
          EOF

      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.34.5 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to npm
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          set -eu
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "::error::refusing to publish with NPM_TOKEN; this workflow uses GitHub OIDC only"
            exit 1
          fi
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const tag = process.env.DIST_TAG || 'beta'
          if (pkg.name !== '@baseland/dsh-evidence') {
            console.error(`refusing to publish unexpected package ${pkg.name}`)
            process.exit(1)
          }
          if (tag !== 'beta' && tag !== 'latest') {
            console.error(`refusing unsupported dist-tag ${tag}`)
            process.exit(1)
          }
          const prerelease = pkg.version.includes('-')
          if (prerelease && tag !== 'beta') {
            console.error(`refusing to publish prerelease ${pkg.version} with dist-tag ${tag}; use beta`)
            process.exit(1)
          }
          if (tag === 'latest' && prerelease) {
            console.error(`refusing to point latest at prerelease ${pkg.version}`)
            process.exit(1)
          }
          console.log(`publishing ${pkg.name}@${pkg.version} with dist-tag ${tag}`)
          EOF
          npm publish --access public --tag "$DIST_TAG" --provenance
